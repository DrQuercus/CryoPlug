<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryoPlug</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="#/projects" title="CryoPlug">
        <img src="favicon.svg" alt="" width="30" height="30">
        <span>CryoPlug</span>
      </a>
      <a class="nav-link" data-nav="projects" href="#/projects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
        <span>Projects</span>
      </a>
      <a class="nav-link" data-nav="queue" href="#/queue">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Queue</span>
        <b class="nav-badge" id="queue-badge" hidden></b>
      </a>
      <a class="nav-link" data-nav="tools" href="#/tools">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
        <span>Tools</span>
      </a>
      <a class="nav-link" data-nav="help" href="#/help">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5v.01"/></svg>
        <span>Help</span>
      </a>
      <div class="sidebar-foot">
        <button class="icon-btn" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
        <button class="icon-btn" id="logout" title="Log out" aria-label="Log out" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14M10 16l-4-4 4-4M6 12h10"/></svg>
        </button>
        <span id="version" class="muted small"></span>
      </div>
    </nav>
    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <div class="workspace">
        <section class="content" id="content" tabindex="-1"></section>
        <aside class="panel" id="panel" hidden></aside>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
