<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryoPlug viewer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --border: rgba(11,11,11,.12); }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1a19; --ink: #fff; --muted: #c3c2b7; --border: rgba(255,255,255,.12); } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--border); }
    header .items { color: var(--muted); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    header label { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
    #app { position: absolute; top: 45px; left: 0; right: 0; bottom: 0; }
    #msg { padding: 24px; max-width: 720px; }
    code { background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <b>CryoPlug viewer</b>
    <span class="items" id="items"></span>
    <label><input type="checkbox" id="fullres"> full-resolution maps</label>
  </header>
  <div id="msg" hidden></div>
  <div id="app"></div>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
