# CryoPlug behind nginx: an example to adapt (README, "Derrière un reverse proxy").
#
# CryoPlug side (~/.cryoplug/config.toml), with user accounts:
#   [server]
#   host = "127.0.0.1"                    # only nginx connects to it
#   trusted_proxies = ["127.0.0.1"]       # the address nginx connects from (e.g. "172.17.0.1" from Docker)
#   public_url = "http://cryoem.example.org"
# CryoPlug is served at the root of a server (or of a port), not under a sub-path.

server {
    listen 80;                            # or: listen 443 ssl; with ssl_certificate and ssl_certificate_key
    server_name cryoem.example.org;       # the name people open

    client_max_body_size 80m;             # uploads from the browser come in chunks of up to 64 MiB
    absolute_redirect off;                # redirections keep the published name and port

    location / {
        proxy_pass http://127.0.0.1:39500;
        proxy_set_header Host $http_host;             # name AND port: CryoPlug checks the origin of changes against it
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3700s;                     # assistants may wait up to an hour for jobs (/mcp)
        proxy_buffering off;                          # maps and models are streamed
        # auth_request /_app_session;                 # see below
    }

    # Optional: the page only for people logged in to another web application of the server (here Open WebUI,
    # on port 8080 of the same machine). nginx only learns that the session is valid: add [external_login] to
    # CryoPlug so that it also knows who is logged in. Assistants should call CryoPlug on its own port: their
    # CryoPlug API tokens are not sessions of that application.
    #
    # location = /_app_session {
    #     internal;
    #     proxy_pass http://127.0.0.1:8080/api/v1/users/user/info;   # Open WebUI: 200 for an approved account
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    # }
    # error_page 401 = @app_login;
    # location @app_login { return 302 http://$host:8080/auth; }
}
